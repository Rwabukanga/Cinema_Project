{% if state == 'committed' or state == 'confirmed' or state == 'paid' or state == 'available' %}<span class="badge text-bg-success">{{ label }}</span>{% elif state == 'aborted' or state == 'cancelled' %}<span class="badge text-bg-danger">{{ label }}</span>{% elif state == 'booked' %}<span class="badge text-bg-secondary">{{ label }}</span>{% else %}<span class="badge text-bg-warning">{{ label }}</span>{% endif %}
