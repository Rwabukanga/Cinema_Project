<!-- Top-up form: POST /api/customers/<id>/top-up/ {"amount": ...} -->
<div class="modal fade" id="topup-modal" tabindex="-1" aria-labelledby="topup-modal-title" aria-hidden="true">
  <div class="modal-dialog modal-sm">
    <form class="modal-content" id="topup-form" data-method="POST" novalidate>
      <div class="modal-header">
        <h5 class="modal-title" id="topup-modal-title"><i class="bi bi-wallet2 me-1"></i> Top up</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-2 text-secondary">Add money to the wallet of <b id="topup-who"></b>.</p>
        <label class="form-label" for="topup-amount">Amount</label>
        <input class="form-control" id="topup-amount" name="amount" type="number" step="0.01" min="1" value="50.00" required>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-success"><i class="bi bi-plus-circle me-1"></i> Add money</button>
      </div>
    </form>
  </div>
</div>
