{% load static i18n %}
{% get_current_language as CURRENT_LANGUAGE %}
<!doctype html>
<html lang="{{ CURRENT_LANGUAGE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sign in{% endblock %} | CineSync</title>
  <script>
    (() => {
      const root = document.documentElement;
      let stored = null;
      try { stored = localStorage.getItem('lte-theme'); } catch { /* private mode */ }
      const dark = stored === 'dark' || (stored !== 'light' && globalThis.matchMedia('(prefers-color-scheme: dark)').matches);
      root.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.3.0/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body class="{% block body_class %}login-page{% endblock %} bg-body-secondary">
  <div class="{% block box_class %}login-box{% endblock %}">
    <div class="auth-logo text-center mb-3">
      <span class="brand-icon brand-icon-lg shadow"><i class="bi bi-film"></i></span>
      <div class="fs-2 mt-2"><b>Cine</b>Sync</div>
      <div class="text-secondary fs-7">Distributed cinema booking · two-phase commit</div>
    </div>
    <div class="card card-outline card-primary shadow-sm">
      <div class="card-body {% block card_class %}login-card-body{% endblock %}">
        {% include 'partials/messages.html' %}
        {% block card %}{% endblock %}
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Show / hide password
    document.querySelectorAll('[data-toggle-password]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const input = document.getElementById(btn.dataset.togglePassword);
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.querySelector('i').className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
      });
    });
  </script>
</body>
</html>
